# Spark -> тот же lakehouse: каталоги Iceberg REST (Lakekeeper), данные в MinIO через S3FileIO.
# Jar'ы монтируются в /opt/spark/iceberg-jars (НЕ поверх /opt/spark/jars, иначе Spark теряет свои библиотеки).
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.jars                                    /opt/spark/iceberg-jars/iceberg-spark-runtime-3.5_2.12-1.7.1.jar,/opt/spark/iceberg-jars/iceberg-aws-bundle-1.7.1.jar
spark.driver.memory                           4g
spark.sql.adaptive.enabled                    true
spark.ui.showConsoleProgress                  false

# каталог bronze (warehouse bronze в Lakekeeper)
spark.sql.catalog.bronze                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bronze.catalog-impl          org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.bronze.uri                   http://host.docker.internal:8181/catalog
spark.sql.catalog.bronze.warehouse             bronze
spark.sql.catalog.bronze.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.bronze.s3.endpoint           http://host.docker.internal:9000
spark.sql.catalog.bronze.s3.path-style-access  true
spark.sql.catalog.bronze.s3.access-key-id      minioadmin
spark.sql.catalog.bronze.s3.secret-access-key  minioadmin
spark.sql.catalog.bronze.s3.region             us-east-1

# каталог bench (warehouse bench в Lakekeeper)
spark.sql.catalog.bench                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bench.catalog-impl          org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.bench.uri                   http://host.docker.internal:8181/catalog
spark.sql.catalog.bench.warehouse             bench
spark.sql.catalog.bench.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.bench.s3.endpoint           http://host.docker.internal:9000
spark.sql.catalog.bench.s3.path-style-access  true
spark.sql.catalog.bench.s3.access-key-id      minioadmin
spark.sql.catalog.bench.s3.secret-access-key  minioadmin
spark.sql.catalog.bench.s3.region             us-east-1
